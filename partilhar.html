<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Partilhar camisola + dados</title>
  <style>
    :root {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #1f1f1f;
      background: #f6f6f6;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 24px 16px 40px;
    }

    main {
      width: min(100%, 560px);
      margin: 0 auto;
    }

    .card {
      background: #fff;
      border: 1px solid #dedede;
      border-radius: 18px;
      padding: 18px;
      box-shadow: 0 6px 24px rgba(0,0,0,.08);
    }

    h1 {
      margin: 0 0 16px;
      font-size: 24px;
    }

    img {
      display: block;
      width: 100%;
      max-height: 420px;
      object-fit: contain;
      border-radius: 12px;
      background: #fff;
    }

    pre {
      margin: 18px 0;
      padding: 16px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      font: inherit;
      line-height: 1.55;
      background: #f7f7f7;
      border-radius: 12px;
    }

    button,
    a.botao {
      display: block;
      width: 100%;
      border: 0;
      border-radius: 999px;
      padding: 15px 18px;
      font: inherit;
      font-weight: 700;
      text-align: center;
      text-decoration: none;
      cursor: pointer;
    }

    #partilhar {
      background: #111;
      color: #fff;
    }

    #whatsapp {
      margin-top: 12px;
      background: #ececec;
      color: #111;
    }

    #fechar {
      margin-top: 12px;
      background: #fff;
      color: #111;
      border: 1px solid #d8d8d8;
    }

    #estado {
      margin: 14px 0 0;
      line-height: 1.45;
    }

    .oculto {
      display: none !important;
    }
  </style>
</head>
<body>
  <main>
    <div class="card">
      <h1 id="titulo">Partilhar camisola + dados</h1>

      <img id="imagem" alt="Imagem do produto" />

      <pre id="texto"></pre>

      <button id="partilhar" type="button">
        Partilhar imagem + dados
      </button>

      <a id="whatsapp" class="botao" target="_blank" rel="noopener">
        Enviar só os dados por WhatsApp
      </a>

      <button id="fechar" type="button">
        Fechar
      </button>

      <p id="estado"></p>
    </div>
  </main>

  <script>
    const params = new URLSearchParams(location.search);

    const imagemUrl = params.get("imagem") || "";
    const titulo = params.get("titulo") || "Produto";
    const texto = params.get("texto") || "";

    const imagemEl = document.getElementById("imagem");
    const tituloEl = document.getElementById("titulo");
    const textoEl = document.getElementById("texto");
    const partilharEl = document.getElementById("partilhar");
    const whatsappEl = document.getElementById("whatsapp");
    const fecharEl = document.getElementById("fechar");
    const estadoEl = document.getElementById("estado");

    tituloEl.textContent = titulo;
    textoEl.textContent = texto;

    if (imagemUrl) {
      imagemEl.src = imagemUrl;
    } else {
      imagemEl.classList.add("oculto");
    }

    whatsappEl.href =
      "https://wa.me/?text=" + encodeURIComponent(texto);

    function extensaoPorTipo(tipo) {
      if (tipo.includes("png")) return "png";
      if (tipo.includes("webp")) return "webp";
      if (tipo.includes("gif")) return "gif";
      return "jpg";
    }

    async function carregarFicheiroImagem() {
      if (!imagemUrl) {
        throw new Error("Não foi recebida nenhuma imagem.");
      }

      const response = await fetch(imagemUrl, {
        mode: "cors",
        credentials: "omit",
      });

      if (!response.ok) {
        throw new Error("Não foi possível carregar a imagem.");
      }

      const blob = await response.blob();
      const tipo = blob.type || "image/jpeg";
      const extensao = extensaoPorTipo(tipo);

      return new File(
        [blob],
        "camisola." + extensao,
        {type: tipo},
      );
    }

    fecharEl.addEventListener("click", () => {
      window.close();

      setTimeout(() => {
        if (!window.closed && history.length > 1) {
          history.back();
        }
      }, 150);
    });

    partilharEl.addEventListener("click", async () => {
      estadoEl.textContent = "A preparar a imagem...";

      try {
        if (!navigator.share || !navigator.canShare) {
          throw new Error(
            "Este browser não suporta partilha de ficheiros."
          );
        }

        const ficheiro = await carregarFicheiroImagem();

        if (!navigator.canShare({files: [ficheiro]})) {
          throw new Error(
            "Este dispositivo não permite partilhar esta imagem como ficheiro."
          );
        }

        estadoEl.textContent = "";

        await navigator.share({
          title: titulo,
          text: texto,
          files: [ficheiro],
        });
      } catch (erro) {
        if (erro && erro.name === "AbortError") {
          estadoEl.textContent = "";
          return;
        }

        console.error(erro);

        estadoEl.textContent =
          "Não foi possível enviar a imagem e o texto juntos. " +
          "Podes usar o botão abaixo para enviar os dados por WhatsApp.";
      }
    });
  </script>
</body>
</html>
